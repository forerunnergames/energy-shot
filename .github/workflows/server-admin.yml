# Manual server administration for the dedicated game server (issue: KOTH + admin).
# Runs over the SAME droplet secrets the release deploy uses, so no console access
# or DO token is ever needed. Trigger from the Actions tab or `gh workflow run
# server-admin.yml -f mode=koth`. Every input defaults to "leave unchanged".
name: Server admin

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Game mode"
        type: choice
        options: [unchanged, koth, zaps]
        default: unchanged
      password:
        description: "New join password (blank = unchanged)"
        type: string
        default: ""
      authorize_ops_key:
        description: "Add the es-ops box's SSH key to game@"
        type: boolean
        default: false
      restart:
        description: "Restart the server to apply"
        type: boolean
        default: true

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Apply
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          MODE: ${{ inputs.mode }}
          PASSWORD: ${{ inputs.password }}
          AUTHORIZE_KEY: ${{ inputs.authorize_ops_key }}
          RESTART: ${{ inputs.restart }}
          OPS_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPY/AXYCLCLVZ2fIcn1fOgOq+kQpdhUpfZC+QOSEtAtR aaron@energyshot-ops"
        run: |
          if [ -z "$DROPLET_HOST" ]; then echo "Deploy secrets absent"; exit 1; fi
          trap 'rm -f droplet_key known_hosts' EXIT
          echo "${{ secrets.DROPLET_SSH_KEY }}" > droplet_key
          chmod 600 droplet_key
          echo "${{ secrets.DROPLET_HOST_KEY }}" > known_hosts
          # Inputs pass as env values, never interpolated into the remote script,
          # so nothing a field could contain can inject a shell command.
          ssh -i droplet_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            root@"$DROPLET_HOST" \
            "MODE='$MODE' PASSWORD='$PASSWORD' AUTHORIZE_KEY='$AUTHORIZE_KEY' RESTART='$RESTART' OPS_KEY='$OPS_KEY' bash -s" <<'ADMIN'
          set -e
          ENV_FILE=/etc/energy-shot/server.env

          # Mode: the server reads --mode from its command line (World.cs), so a
          # systemd drop-in overrides ExecStart with the chosen mode appended. The
          # base ExecStart is read from the real unit file, immune to this drop-in.
          if [ "$MODE" != "unchanged" ]; then
            unit=$(systemctl show -p FragmentPath --value energy-shot)
            base=$(grep -m1 '^ExecStart=' "$unit" | sed 's/^ExecStart=//')
            cleaned=$(printf '%s' "$base" | sed -E 's/ --mode [^ ]+//g')
            mkdir -p /etc/systemd/system/energy-shot.service.d
            printf '[Service]\nExecStart=\nExecStart=%s --mode %s\n' "$cleaned" "$MODE" \
              > /etc/systemd/system/energy-shot.service.d/mode.conf
            systemctl daemon-reload
            echo "mode set to $MODE"
          fi

          # Password: the env file holds SERVER_PASSWORD (loaded via EnvironmentFile).
          if [ -n "$PASSWORD" ]; then
            mkdir -p "$(dirname "$ENV_FILE")"
            touch "$ENV_FILE"
            if grep -q '^SERVER_PASSWORD=' "$ENV_FILE"; then
              sed -i "s|^SERVER_PASSWORD=.*|SERVER_PASSWORD=$PASSWORD|" "$ENV_FILE"
            else
              echo "SERVER_PASSWORD=$PASSWORD" >> "$ENV_FILE"
            fi
            chmod 600 "$ENV_FILE"
            echo "password updated (${#PASSWORD} chars)"
          fi

          # Authorize the ops box's key on the game user (idempotent).
          if [ "$AUTHORIZE_KEY" = "true" ]; then
            mkdir -p /home/game/.ssh
            touch /home/game/.ssh/authorized_keys
            grep -qF "$OPS_KEY" /home/game/.ssh/authorized_keys || echo "$OPS_KEY" >> /home/game/.ssh/authorized_keys
            chown -R game:game /home/game/.ssh
            chmod 700 /home/game/.ssh
            chmod 600 /home/game/.ssh/authorized_keys
            echo "ops key authorized"
          fi

          if [ "$RESTART" = "true" ]; then
            echo "Admin change applied - server restarting, back in a moment!" > /home/game/admin-message
            chown game:game /home/game/admin-message
            sleep 5
            systemctl restart energy-shot
            sleep 3
            systemctl is-active energy-shot
            echo "active mode line:"
            systemctl show -p ExecStart --value energy-shot | grep -o -- '--mode [a-z]*' || echo "(no --mode = zaps default)"
          fi
          ADMIN

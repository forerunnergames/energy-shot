# Manual server administration for the dedicated game server (issue: KOTH + admin).
# Runs over the SAME droplet secrets the release deploy uses, so no console access
# or DO token is ever needed. Trigger from the Actions tab or `gh workflow run
# server-admin.yml -f mode=koth`. Every input defaults to "leave unchanged".
name: Server admin

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Game mode"
        type: choice
        options: [unchanged, koth, zaps]
        default: unchanged
      round_minutes:
        description: "Round length in minutes (blank = unchanged, 0 = no time limit)"
        type: string
        default: ""
      point_limit:
        description: "Points to win - zaps, or hill seconds in KOTH (blank = unchanged, 0 = none)"
        type: string
        default: ""
      hill_rotate_seconds:
        description: "KOTH: seconds before the hill moves (blank = unchanged, 0 = never)"
        type: string
        default: ""
      password:
        description: "New join password (blank = unchanged)"
        type: string
        default: ""
      authorize_ops_key:
        description: "Add the es-ops box's SSH key to game@"
        type: boolean
        default: false
      restart:
        description: "Restart the server to apply (needed for mode/password to take effect)"
        type: boolean
        default: false

# One admin run at a time (CodeRabbit): two concurrent dispatches could interleave
# the drop-in & env-file writes & leave a server state neither run asked for.
concurrency:
  group: server-admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Apply
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          MODE: ${{ inputs.mode }}
          ROUND_MINUTES: ${{ inputs.round_minutes }}
          POINT_LIMIT: ${{ inputs.point_limit }}
          HILL_ROTATE: ${{ inputs.hill_rotate_seconds }}
          PASSWORD: ${{ inputs.password }}
          AUTHORIZE_KEY: ${{ inputs.authorize_ops_key }}
          RESTART: ${{ inputs.restart }}
          OPS_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPY/AXYCLCLVZ2fIcn1fOgOq+kQpdhUpfZC+QOSEtAtR aaron@energyshot-ops"
        run: |
          if [ -z "$DROPLET_HOST" ]; then echo "Deploy secrets absent"; exit 1; fi
          # A dispatch input is NOT a registered secret, so nothing redacts it for
          # us (CodeRabbit): register it with the runner before it can reach any log
          # or error trace. Nothing below ever echoes the value itself.
          if [ -n "$PASSWORD" ]; then echo "::add-mask::$PASSWORD"; fi
          trap 'rm -f droplet_key known_hosts' EXIT
          echo "${{ secrets.DROPLET_SSH_KEY }}" > droplet_key
          chmod 600 droplet_key
          echo "${{ secrets.DROPLET_HOST_KEY }}" > known_hosts
          # Inputs pass as env values, never interpolated into the remote script,
          # so nothing a field could contain can inject a shell command.
          ssh -i droplet_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            root@"$DROPLET_HOST" \
            "MODE='$MODE' ROUND_MINUTES='$ROUND_MINUTES' POINT_LIMIT='$POINT_LIMIT' HILL_ROTATE='$HILL_ROTATE' PASSWORD='$PASSWORD' AUTHORIZE_KEY='$AUTHORIZE_KEY' RESTART='$RESTART' OPS_KEY='$OPS_KEY' bash -s" <<'ADMIN'
          set -e
          ENV_FILE=/etc/energy-shot/server.env

          # Game settings live in the server's ARGS, never in code (Aaron,
          # 2026-08-24): the extra args are kept in one state file, edited flag by
          # flag, & re-emitted as a systemd drop-in over the real unit's ExecStart.
          # A run that changes one setting therefore keeps every other setting.
          ARGS_FILE=/etc/energy-shot/extra-args
          mkdir -p /etc/energy-shot
          touch "$ARGS_FILE"
          extra=$(cat "$ARGS_FILE")

          set_arg() { # flag value
            extra=$(printf '%s' "$extra" | sed -E "s| $1 [^ ]+||g")
            [ -n "$2" ] && extra="$extra $1 $2"
          }

          [ "$MODE" != "unchanged" ] && set_arg --mode "$MODE"
          [ -n "$ROUND_MINUTES" ] && set_arg --round-minutes "$ROUND_MINUTES"
          [ -n "$POINT_LIMIT" ] && set_arg --zap-limit "$POINT_LIMIT"
          [ -n "$HILL_ROTATE" ] && set_arg --hill-rotate-seconds "$HILL_ROTATE"

          if [ "$MODE" != "unchanged" ] || [ -n "$ROUND_MINUTES" ] || [ -n "$POINT_LIMIT" ] || [ -n "$HILL_ROTATE" ]; then
            printf '%s' "$extra" > "$ARGS_FILE"
            unit=$(systemctl show -p FragmentPath --value energy-shot)
            base=$(grep -m1 '^ExecStart=' "$unit" | sed 's/^ExecStart=//')
            mkdir -p /etc/systemd/system/energy-shot.service.d
            printf '[Service]\nExecStart=\nExecStart=%s%s\n' "$base" "$extra" \
              > /etc/systemd/system/energy-shot.service.d/mode.conf
            systemctl daemon-reload
            echo "settings now:$extra"
          fi

          # Password: the env file holds SERVER_PASSWORD (loaded via EnvironmentFile).
          if [ -n "$PASSWORD" ]; then
            mkdir -p "$(dirname "$ENV_FILE")"
            touch "$ENV_FILE"
            if grep -q '^SERVER_PASSWORD=' "$ENV_FILE"; then
              sed -i "s|^SERVER_PASSWORD=.*|SERVER_PASSWORD=$PASSWORD|" "$ENV_FILE"
            else
              echo "SERVER_PASSWORD=$PASSWORD" >> "$ENV_FILE"
            fi
            chmod 600 "$ENV_FILE"
            echo "password updated (${#PASSWORD} chars)"
          fi

          # Authorize the ops box's key on the game user (idempotent).
          if [ "$AUTHORIZE_KEY" = "true" ]; then
            mkdir -p /home/game/.ssh
            touch /home/game/.ssh/authorized_keys
            grep -qF "$OPS_KEY" /home/game/.ssh/authorized_keys || echo "$OPS_KEY" >> /home/game/.ssh/authorized_keys
            chown -R game:game /home/game/.ssh
            chmod 700 /home/game/.ssh
            chmod 600 /home/game/.ssh/authorized_keys
            echo "ops key authorized"
          fi

          if [ "$RESTART" = "true" ]; then
            echo "Admin change applied - server restarting, back in a moment!" > /home/game/admin-message
            chown game:game /home/game/admin-message
            sleep 5
            systemctl restart energy-shot
            sleep 3
            systemctl is-active energy-shot
            echo "active mode line:"
            systemctl show -p ExecStart --value energy-shot | grep -o -- '--mode [a-z]*' || echo "(no --mode = zaps default)"
          fi
          ADMIN

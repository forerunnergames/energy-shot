# Manual server administration for the dedicated game server (issue: KOTH + admin).
# Runs over the SAME droplet secrets the release deploy uses, so no console access
# or DO token is ever needed. Trigger from the Actions tab or `gh workflow run
# server-admin.yml -f mode=koth`. Every input defaults to "leave unchanged".
name: Server admin

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Game mode"
        type: choice
        options: [unchanged, koth, zaps]
        default: unchanged
      round_minutes:
        description: "Round length in minutes (blank = unchanged, 0 = no time limit)"
        type: string
        default: ""
      point_limit:
        description: "Points to win - zaps, or hill seconds in KOTH (blank = unchanged, 0 = none)"
        type: string
        default: ""
      hill_rotate_seconds:
        description: "KOTH: seconds before the hill moves (blank = unchanged, 0 = never)"
        type: string
        default: ""
      password:
        description: "New join password (blank = unchanged)"
        type: string
        default: ""
      verify_password:
        description: "Verify: does this value match the LIVE join password? (read-only, prints MATCH/NO MATCH)"
        type: string
        default: ""
      authorize_ops_key:
        description: "Add the es-ops box's SSH key to game@"
        type: boolean
        default: false
      restart:
        description: "Restart the server to apply (needed for mode/password to take effect)"
        type: boolean
        default: false

# One admin run at a time (CodeRabbit): two concurrent dispatches could interleave
# the drop-in & env-file writes & leave a server state neither run asked for.
concurrency:
  group: server-admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Apply
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          MODE: ${{ inputs.mode }}
          ROUND_MINUTES: ${{ inputs.round_minutes }}
          POINT_LIMIT: ${{ inputs.point_limit }}
          HILL_ROTATE: ${{ inputs.hill_rotate_seconds }}
          PASSWORD: ${{ inputs.password }}
          VERIFY_PASSWORD: ${{ inputs.verify_password }}
          AUTHORIZE_KEY: ${{ inputs.authorize_ops_key }}
          RESTART: ${{ inputs.restart }}
          OPS_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPY/AXYCLCLVZ2fIcn1fOgOq+kQpdhUpfZC+QOSEtAtR aaron@energyshot-ops"
        run: |
          if [ -z "$DROPLET_HOST" ]; then echo "Deploy secrets absent"; exit 1; fi
          # A dispatch input is NOT a registered secret, so nothing redacts it for
          # us (CodeRabbit): register it with the runner before it can reach any log
          # or error trace. Nothing below ever echoes the value itself.
          if [ -n "$PASSWORD" ]; then echo "::add-mask::$PASSWORD"; fi
          if [ -n "$VERIFY_PASSWORD" ]; then echo "::add-mask::$VERIFY_PASSWORD"; fi
          trap 'rm -f droplet_key known_hosts' EXIT
          echo "${{ secrets.DROPLET_SSH_KEY }}" > droplet_key
          chmod 600 droplet_key
          echo "${{ secrets.DROPLET_HOST_KEY }}" > known_hosts
          # base64-encode every value: the output is [A-Za-z0-9+/=] only, so passing
          # it through the remote command line & decoding on the far side means NO
          # value - a password with a quote, a crafted mode string - is ever parsed
          # as shell syntax. Mask the encoded secrets too, so a trace can't leak them.
          MODE_B64=$(printf %s "$MODE" | base64 -w0)
          ROUND_MINUTES_B64=$(printf %s "$ROUND_MINUTES" | base64 -w0)
          POINT_LIMIT_B64=$(printf %s "$POINT_LIMIT" | base64 -w0)
          HILL_ROTATE_B64=$(printf %s "$HILL_ROTATE" | base64 -w0)
          PASSWORD_B64=$(printf %s "$PASSWORD" | base64 -w0)
          VERIFY_PASSWORD_B64=$(printf %s "$VERIFY_PASSWORD" | base64 -w0)
          [ -n "$PASSWORD" ] && echo "::add-mask::$PASSWORD_B64"
          [ -n "$VERIFY_PASSWORD" ] && echo "::add-mask::$VERIFY_PASSWORD_B64"
          # AUTHORIZE_KEY & RESTART are booleans, OPS_KEY our own constant - no metachars.
          ssh -i droplet_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            root@"$DROPLET_HOST" \
            "MODE_B64='$MODE_B64' ROUND_MINUTES_B64='$ROUND_MINUTES_B64' POINT_LIMIT_B64='$POINT_LIMIT_B64' HILL_ROTATE_B64='$HILL_ROTATE_B64' PASSWORD_B64='$PASSWORD_B64' VERIFY_PASSWORD_B64='$VERIFY_PASSWORD_B64' AUTHORIZE_KEY='$AUTHORIZE_KEY' RESTART='$RESTART' OPS_KEY='$OPS_KEY' bash -s" <<'ADMIN'
          set -e
          MODE=$(printf %s "$MODE_B64" | base64 -d)
          ROUND_MINUTES=$(printf %s "$ROUND_MINUTES_B64" | base64 -d)
          POINT_LIMIT=$(printf %s "$POINT_LIMIT_B64" | base64 -d)
          HILL_ROTATE=$(printf %s "$HILL_ROTATE_B64" | base64 -d)
          PASSWORD=$(printf %s "$PASSWORD_B64" | base64 -d)
          VERIFY_PASSWORD=$(printf %s "$VERIFY_PASSWORD_B64" | base64 -d)

          # base64 stops these being read as SHELL syntax; it does nothing about the
          # CONFIG files they end up in (CodeRabbit on #410). The settings are joined
          # into ExecStart in a systemd drop-in & the password becomes a line in an
          # EnvironmentFile - so a value carrying a newline writes a directive of the
          # caller's choosing (User=root, ExecStartPre=...) or extra environment
          # variables, both of which the server then runs as root. Validate shape
          # BEFORE anything is written: settings are whole numbers, mode is one of
          # three words, & no value may contain a line break.
          die() { echo "$1" >&2; exit 1; }
          is_uint() { case "$1" in "" | *[!0-9]*) return 1 ;; *) [ "${#1}" -le 6 ] ;; esac; }
          has_break() { case "$1" in *[$'\n\r']*) return 0 ;; *) return 1 ;; esac; }
          case "$MODE" in unchanged | koth | zaps) ;; *) die "mode must be unchanged, koth or zaps" ;; esac
          [ -z "$ROUND_MINUTES" ] || is_uint "$ROUND_MINUTES" || die "round-minutes must be a whole number"
          [ -z "$POINT_LIMIT" ] || is_uint "$POINT_LIMIT" || die "point-limit must be a whole number"
          [ -z "$HILL_ROTATE" ] || is_uint "$HILL_ROTATE" || die "hill-rotate-seconds must be a whole number"
          has_break "$PASSWORD" && die "password cannot contain a line break"
          has_break "$VERIFY_PASSWORD" && die "verify-password cannot contain a line break"

          ENV_FILE=/etc/energy-shot/server.env

          # Game settings live in the server's ARGS, never in code (Aaron,
          # 2026-08-24): the extra args are kept in one state file, edited flag by
          # flag, & re-emitted as a systemd drop-in over the real unit's ExecStart.
          # A run that changes one setting therefore keeps every other setting.
          ARGS_FILE=/etc/energy-shot/extra-args
          mkdir -p /etc/energy-shot
          touch "$ARGS_FILE"
          extra=$(cat "$ARGS_FILE")

          set_arg() { # flag value - rebuild without sed (no metachars, no prefix collisions)
            local out="" skip=0 tok
            # Word-splitting is wanted here, GLOBBING is not: unquoted $extra also
            # expands *, ? & [...] against the cwd, so a point-limit of "*" rewrote
            # the args file as the directory listing. Dropping sed removed the
            # metacharacter risk; it must not hand it back to the shell.
            set -f
            for tok in $extra; do
              [ "$skip" = 1 ] && { skip=0; continue; }
              [ "$tok" = "$1" ] && { skip=1; continue; }
              out="$out $tok"
            done
            set +f
            extra="${out# }"
            [ -n "$2" ] && extra="$extra $1 $2"
          }

          [ "$MODE" != "unchanged" ] && set_arg --mode "$MODE"
          [ -n "$ROUND_MINUTES" ] && set_arg --round-minutes "$ROUND_MINUTES"
          [ -n "$POINT_LIMIT" ] && set_arg --zap-limit "$POINT_LIMIT"
          [ -n "$HILL_ROTATE" ] && set_arg --hill-rotate-seconds "$HILL_ROTATE"

          if [ "$MODE" != "unchanged" ] || [ -n "$ROUND_MINUTES" ] || [ -n "$POINT_LIMIT" ] || [ -n "$HILL_ROTATE" ]; then
            printf '%s' "$extra" > "$ARGS_FILE"
            unit=$(systemctl show -p FragmentPath --value energy-shot)
            base=$(grep -m1 '^ExecStart=' "$unit" | sed 's/^ExecStart=//')
            mkdir -p /etc/systemd/system/energy-shot.service.d
            printf '[Service]\nExecStart=\nExecStart=%s%s\n' "$base" "$extra" \
              > /etc/systemd/system/energy-shot.service.d/mode.conf
            systemctl daemon-reload
            echo "settings now:$extra"
          fi

          # Password: the env file holds SERVER_PASSWORD (loaded via EnvironmentFile).
          if [ -n "$PASSWORD" ]; then
            mkdir -p "$(dirname "$ENV_FILE")"
            touch "$ENV_FILE"
            # Same directory, not /tmp: the replace is then a real atomic rename, &
            # the password never exists outside the 0600 directory it belongs in.
            tmp=$(mktemp -p "$(dirname "$ENV_FILE")")
            chmod 600 "$tmp"
            # grep exits 1 for "matched nothing" & 2 for a READ ERROR; `|| true` took
            # both, so an unreadable env file became an empty temp file & the mv then
            # replaced every other setting with just the password (CodeRabbit on #410).
            set +e
            grep -v '^SERVER_PASSWORD=' "$ENV_FILE" > "$tmp"
            grep_status=$?
            set -e
            [ "$grep_status" -le 1 ] || { rm -f "$tmp"; die "could not read $ENV_FILE (grep exit $grep_status)"; }
            printf 'SERVER_PASSWORD=%s\n' "$PASSWORD" >> "$tmp"     # value is an arg, not sed/format text
            mv "$tmp" "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo "password updated (${#PASSWORD} chars)"
          fi

          # Read-only password verification (Aaron's ruling: a password may be
          # announced ONLY once verified against the LIVE server, never from
          # memory). Compares & prints a verdict - the value itself is masked on
          # the runner & never printed here.
          if [ -n "$VERIFY_PASSWORD" ]; then
            LIVE=$(grep '^SERVER_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
            if [ "$LIVE" = "$VERIFY_PASSWORD" ]; then echo "verify: MATCH - value is the live join password"; else echo "verify: NO MATCH (live password is ${#LIVE} chars)"; fi
          fi

          # Authorize the ops box's key on the game user (idempotent).
          if [ "$AUTHORIZE_KEY" = "true" ]; then
            mkdir -p /home/game/.ssh
            touch /home/game/.ssh/authorized_keys
            grep -qF "$OPS_KEY" /home/game/.ssh/authorized_keys || echo "$OPS_KEY" >> /home/game/.ssh/authorized_keys
            chown -R game:game /home/game/.ssh
            chmod 700 /home/game/.ssh
            chmod 600 /home/game/.ssh/authorized_keys
            echo "ops key authorized"
          fi

          if [ "$RESTART" = "true" ]; then
            echo "Admin change applied - server restarting, back in a moment!" > /home/game/admin-message
            chown game:game /home/game/admin-message
            sleep 5
            systemctl restart energy-shot
            sleep 3
            systemctl is-active energy-shot
            echo "active mode line:"
            systemctl show -p ExecStart --value energy-shot | grep -o -- '--mode [a-z]*' || echo "(no --mode = zaps default)"
          fi
          ADMIN
